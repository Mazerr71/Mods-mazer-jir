<!--
  ====================================================================
  CARA EDIT CEPAT — MAZER ALL MODS PORTFOLIO
  ====================================================================
  Semua data (nama, bio, daftar modpack, galeri, changelog, versi,
  link download, link sosial) ada di satu tempat: cari "const siteData"
  di bagian <script> paling bawah file ini.

  1) FOTO PROFIL
     Taruh foto profil kamu di folder yang sama dengan nama file
     "mazer-icon.jpg". Kalau nama file beda, ganti juga nilai
     user.avatar di data.

  2) LINK SOSIAL & DONASI
     Edit array socials. Tombol pertama ("donate") otomatis tampil
     sebagai tombol menonjol. Ganti url "#" dengan link asli kamu.

  3) LINK DOWNLOAD
     Cari versions di data modpack. Ganti downloadUrl "#" dengan
     link MediaFire / CurseForge / Modrinth kamu.

  4) TAMBAH VERSI MODPACK
     Salin blok versi yang sudah ada, ganti nama versi, filename,
     dan downloadUrl-nya.

  5) FOTO SETTING & GALERI
     Isi specialSettings dan gallery dengan objek { img, title, desc }.
     Letakkan file gambar di folder yang sama dengan index.html.

  6) TAMBAH MODPACK BARU
     Salin seluruh objek di array modpacks, lalu ganti isinya.

  7) STATISTIK
     Download & like menggunakan counter online gratis (otomatis).
  ====================================================================
-->

  :root{

    --text-dim:#9c9894;

  .name-glow{

  html{ scroll-behavior:smooth; }
  body{

  /* ---------- icon buttons ---------- */

    position:relative;

  .social-row a::after{
    content:"";

  .social-row a:nth-child(3)::after{ animation-delay:1s; }
  .social-row a:nth-child(4)::after{ animation-delay:1.5s; }

  /* tombol donasi — tetap merah senada, dibedakan lewat bentuk pill saja (bukan lewat efek kinclong) */
  .social-row a.social-donate{

  .social-row a.social-donate svg{ width:16px; height:16px; }

  .stat-row{

  .detail-hero::before{
    content:"";

const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));

let activeSlug = null;
let selectedVersion = null;

function findModpack(slug){
  return siteData.modpacks.find(m => m.slug === slug);
}

function iconSvg(name, extra){
  return `<i data-lucide="${name}"${extra ? ' '+extra : ''}></i>`;
}

/* Kalau foto galeri/setting gagal dimuat (nama file salah, belum
   diupload ke server, dll), jangan tampilkan ikon "gambar rusak"
   bawaan browser yang jelek — ganti dengan kotak placeholder rapi
   supaya tampilan tetap enak dilihat. */
function handleImgError(img){
  const box = document.createElement('div');
  box.className = 'gallery-img-error';
  box.innerHTML = `${iconSvg('image-off')}<span>Image failed to load</span>`;
  img.replaceWith(box);
  safeCreateIcons();
}

/* Kalau CDN lucide gagal/lambat dimuat (koneksi jelek, diblokir, dll),
   jangan sampai seluruh script berhenti karena error — cukup lewati
   pembuatan ikon, sisanya (tombol, tab, navigasi) tetap jalan normal. */
function safeCreateIcons(){
  if (window.lucide && typeof lucide.createIcons === 'function') {
    lucide.createIcons();
  }
}

};
function brandIconSvg(name){ return BRAND_ICONS[name] || ''; }

/* ---------- statistik real-time (download & like) ----------
   Memakai layanan counter gratis pihak ketiga (tanpa perlu server
   sendiri) supaya angka download & like sama untuk semua orang dan
   selalu update. Kalau layanan ini suatu saat tidak bisa diakses,
   kodenya otomatis "jatuh" ke angka lokal terakhir, jadi web tidak
   akan error atau nge-blank. */
const COUNTER_API = "https://countapi.mileshilliard.com/api/v1";

function counterKey(slug, type){
  return `mazer-${slug}-${type}`.toLowerCase().replace(/[^a-z0-9_\-.]/g, '-');
}
async function counterGet(key){
  try{
    const res = await fetch(`${COUNTER_API}/get/${key}`);
    if(!res.ok) return 0; // key belum pernah dipakai -> anggap 0
    const data = await res.json();
    return parseInt(data.value, 10) || 0;
  }catch(e){ return null; } // null = gagal konek, jangan timpa angka lokal
}
async function counterHit(key){
  try{
    const res = await fetch(`${COUNTER_API}/hit/${key}`);
    if(!res.ok) return null;
    const data = await res.json();
    return parseInt(data.value, 10);
  }catch(e){ return null; }
}
async function counterSet(key, value){
  try{
    const res = await fetch(`${COUNTER_API}/set/${key}?value=${value}`);
    if(!res.ok) return null;
    const data = await res.json();
    return parseInt(data.value, 10);
  }catch(e){ return null; }
}
async function syncModpackStats(m){
  const [dl, fw] = await Promise.all([
    counterGet(counterKey(m.slug, 'downloads')),
    counterGet(counterKey(m.slug, 'likes'))
  ]);
  if(dl !== null) m.downloads = dl;
  if(fw !== null) m.followers = fw;
}
async function refreshStatsAndRerender(){
  await Promise.all(siteData.modpacks.map(syncModpackStats));
  renderProfile();
  if(activeSlug) renderDetail(activeSlug);
}

/* ---------- render: profil ---------- */
function renderProfile(){
  const u = siteData.user;
  $('#pAvatar').src = u.avatar;
  $('#pName').textContent = u.name;
  $('#pBio').textContent = u.bio;

  $('#socialRow').innerHTML = u.socials.map(s => {
    const isDonate = s.icon === 'donate';
    const icon = isDonate ? iconSvg('gift') : brandIconSvg(s.icon);
    return `<a href="${s.url}" target="_blank" rel="noopener" class="${isDonate ? 'social-donate' : ''}" aria-label="${s.label}" title="${s.label}">${icon}${isDonate ? `<span>${s.label}</span>` : ''}</a>`;
  }).join('');

  $('#modpackList').innerHTML = siteData.modpacks.map((m, i) => `
    <button class="mp-card" data-slug="${m.slug}" style="animation-delay:${i * 70}ms">
      <img class="mp-thumb" src="${m.icon}" alt="">
      <div class="mp-info">
        <h3 class="mp-name name-glow">${m.name}</h3>
        <p class="mp-desc">${m.shortDesc}</p>
        <div class="mp-tags">${m.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
        <div class="mp-stats">
          <span>${iconSvg('download')}${m.downloads}</span>
          <span>${iconSvg('heart')}${m.followers}</span>
          <span>${iconSvg('clock')}${m.updatedLabel}</span>
        </div>
      </div>
    </button>
  `).join('');

  $$('.mp-card').forEach(card => {
    card.addEventListener('click', () => navigateTo(card.dataset.slug));
  });

  safeCreateIcons();
}

/* ---------- render: detail modpack ---------- */
function renderDetail(slug){
  const m = findModpack(slug);
  if(!m) return;
  activeSlug = slug;

  $('#dIcon').src = m.icon;
  $('#dName').textContent = m.name;
  $('#dDesc').textContent = m.shortDesc;
  $('#dDownloads').textContent = `${m.downloads} downloads`;
  $('#dFollowers').textContent = `${m.followers} followers`;

  $('#followBtn').classList.toggle('active', m.isFollowing);
  $('#saveBtn').classList.toggle('active', m.isSaved);

  // tab: description
  $('#panel-description').innerHTML = `<p class="desc-text">${m.longDesc}</p>`;

  // tab: gallery — bagian "special settings" (setting wajib biar stabil)
  // tampil dulu di paling atas, baru di bawahnya perbandingan FPS.
  const settingsHtml = (m.specialSettings && m.specialSettings.length > 0) ? `
    <div class="gallery-section">
      <h3 class="gallery-section-title">${iconSvg('settings-2')}Special Settings for Stable Performance</h3>
      <div class="gallery-grid">${m.specialSettings.map(g => `
        <div class="gallery-item">
          <img src="${g.img}" alt="${g.title}" onerror="handleImgError(this)">
          <h4>${g.title}</h4>
          <p>${g.desc}</p>
        </div>
      `).join('')}</div>
    </div>` : '';

  if(m.gallery.length === 0 && (!m.specialSettings || m.specialSettings.length === 0)){
    $('#panel-gallery').innerHTML = `
      <div class="empty-state">
        ${iconSvg('image')}
        <p>No screenshots yet for ${m.name}. Add them via the <code>gallery</code> array in the modpack data code.</p>
      </div>`;
  } else {
    const fpsHtml = m.gallery.length > 0 ? `
      <div class="gallery-section">
        ${settingsHtml ? `<h3 class="gallery-section-title">${iconSvg('bar-chart-3')}FPS Comparison</h3>` : ''}
        <div class="gallery-grid">${m.gallery.map(g => `
          <div class="gallery-item">
            <img src="${g.img}" alt="${g.title}" onerror="handleImgError(this)">
            <h4>${g.title}</h4>
            <p>${g.desc}</p>
            <span class="gallery-date">${iconSvg('calendar')}${g.date}</span>
          </div>
        `).join('')}</div>
      </div>` : '';
    $('#panel-gallery').innerHTML = settingsHtml + fpsHtml;
  }

  // tab: changelog
  $('#panel-changelog').innerHTML = m.changelog.map(c => `
    <div class="changelog-entry">
      <div class="changelog-head">
        <span class="changelog-version">v${c.version}</span>
        <span class="changelog-date">${c.date}</span>
      </div>
      <ul>${c.notes.map(n => `<li>${n}</li>`).join('')}</ul>
    </div>
  `).join('');

  // tab: versions
  $('#panel-versions').innerHTML = Object.keys(m.versions).map(v => `
    <div class="version-row">
      <span class="vname">${v}</span>
      <span class="vloader">${iconSvg('wrench')}${m.loader}</span>
    </div>
  `).join('');

  safeCreateIcons();
}

/* ---------- tabs ---------- */
function setupTabs(){
  $$('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      $$('.tab-btn').forEach(b => b.classList.remove('active'));
      $$('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      $(`#panel-${btn.dataset.tab}`).classList.add('active');
    });
  });
}

/* ---------- routing ---------- */
function canUseHistoryApi(){
  return window.location.protocol.startsWith('http');
}

function showView(viewId){
  $$('.view').forEach(v => v.classList.remove('active'));
  $(`#${viewId}`).classList.add('active');
  window.scrollTo(0, 0);
}

function navigateTo(slug, push = true){
  renderDetail(slug);
  showView('view-detail');
  if(push && canUseHistoryApi()){
    history.pushState({ slug }, '', `/modpack/${slug}`);
  }
}

function navigateHome(push = true){
  showView('view-profile');
  if(push && canUseHistoryApi()){
    history.pushState({}, '', '/');
  }
}

window.addEventListener('popstate', (e) => {
  const path = window.location.pathname;
  const match = path.match(/^\/modpack\/(.+)$/);
  if(match && findModpack(match[1])){
    navigateTo(match[1], false);
  } else {
    navigateHome(false);
  }
});

/* ---------- popovers (menu titik tiga) ---------- */
function setupPopover(btnId, popId){
  const btn = $(`#${btnId}`), pop = $(`#${popId}`);
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    pop.classList.toggle('open');
  });
  document.addEventListener('click', () => pop.classList.remove('open'));
  pop.addEventListener('click', (e) => e.stopPropagation());
}

/* ---------- follow / save toggle ---------- */
function setupActionToggles(){
  $('#followBtn').addEventListener('click', async () => {
    const m = findModpack(activeSlug);
    const willFollow = !m.isFollowing;
    m.isFollowing = willFollow;
    $('#followBtn').classList.toggle('active', willFollow); // update instan, tidak nunggu jaringan
    const key = counterKey(m.slug, 'likes');
    const newVal = willFollow
      ? await counterHit(key)
      : await counterSet(key, Math.max(0, (m.followers || 0) - 1));
    m.followers = (newVal !== null) ? newVal : Math.max(0, m.followers + (willFollow ? 1 : -1));
    renderDetail(activeSlug);
  });
  $('#saveBtn').addEventListener('click', () => {
    const m = findModpack(activeSlug);
    m.isSaved = !m.isSaved;
    $('#saveBtn').classList.toggle('active', m.isSaved);
  });
}

/* ---------- copy link helpers ---------- */
function copyText(text){
  if(navigator.clipboard){ navigator.clipboard.writeText(text); }
}

/* ---------- modal: pilih versi download ---------- */
function openModal(slug){
  const m = findModpack(slug);
  $('#sheetIcon').src = m.icon;
  $('#sheetTitle').textContent = `Download ${m.name}`;

  const versionKeys = Object.keys(m.versions);
  selectedVersion = versionKeys[0];

  $('#versionDropdownList').innerHTML = versionKeys.map(v => `
    <button data-version="${v}" class="${v === selectedVersion ? 'selected' : ''}">${v}</button>
  `).join('');
  $('#versionDropdownLabel').textContent = selectedVersion;

  $$('#versionDropdownList button').forEach(b => {
    b.addEventListener('click', () => {
      selectedVersion = b.dataset.version;
      $('#versionDropdownLabel').textContent = selectedVersion;
      $$('#versionDropdownList button').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
      $('#versionDropdownList').classList.remove('open');
      $('#versionDropdownBtn').classList.remove('open');
      renderFileList(m, selectedVersion);
    });
  });

  renderFileList(m, selectedVersion);

  $('#modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  safeCreateIcons();
}

function renderFileList(m, version){
  const files = m.versions[version] || [];
  $('#fileList').innerHTML = files.map(f => `
    <a class="file-download-btn" href="${f.downloadUrl}" target="_blank" rel="noopener" data-slug="${m.slug}">
      <div class="file-meta">
        <div class="file-name">${f.filename}</div>
        <div class="file-version">Version ${f.version} • via Mediafire</div>
      </div>
      <span class="file-go">${iconSvg('arrow-down-to-line')}</span>
    </a>
  `).join('');
  $$('#fileList .file-download-btn').forEach(a => {
    a.addEventListener('click', () => handleDownloadClick(a.dataset.slug));
  });
  safeCreateIcons();
}

/* Tercatat begitu tombol download diklik (sebelum pindah ke Mediafire),
   lalu angkanya disinkronkan lagi lewat layanan counter. */
async function handleDownloadClick(slug){
  const m = findModpack(slug);
  if(!m) return;
  const newVal = await counterHit(counterKey(slug, 'downloads'));
  m.downloads = (newVal !== null) ? newVal : m.downloads + 1;
  renderProfile();
  if(activeSlug === slug) renderDetail(slug);
}

function closeModal(){
  $('#modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
  $('#versionDropdownList').classList.remove('open');
  $('#versionDropdownBtn').classList.remove('open');
}

/* ---------- init ---------- */
function init(){
  renderProfile();
  setupTabs();
  setupPopover('profileMenuBtn', 'profilePopover');
  setupPopover('detailMenuBtn', 'detailPopover');
  setupActionToggles();

  $('#backBtn').addEventListener('click', () => navigateHome());
  $('#downloadBtn').addEventListener('click', () => openModal(activeSlug));
  $('#closeModalBtn').addEventListener('click', closeModal);
  $('#modalOverlay').addEventListener('click', (e) => {
    if(e.target === $('#modalOverlay')) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') closeModal();
  });

  $('#versionDropdownBtn').addEventListener('click', () => {
    $('#versionDropdownList').classList.toggle('open');
    $('#versionDropdownBtn').classList.toggle('open');
  });

  $('#copyProfileLink').addEventListener('click', () => {
    copyText(window.location.origin + '/');
  });
  $('#shareProfile').addEventListener('click', () => {
    if(navigator.share){ navigator.share({ title: siteData.user.name, url: window.location.origin + '/' }); }
    else { copyText(window.location.origin + '/'); }
  });
  $('#copyModpackLink').addEventListener('click', () => {
    copyText(window.location.origin + '/modpack/' + activeSlug);
  });

  // routing awal berdasarkan URL saat halaman dibuka
  const path = window.location.pathname;
  const match = path.match(/^\/modpack\/(.+)$/);
  if(match && findModpack(match[1])){
    navigateTo(match[1], false);
  } else {
    navigateHome(false);
  }

  // Ambil angka download & like terbaru dari layanan counter tanpa
  // memblokir tampilan awal (halaman tetap langsung muncul).
  refreshStatsAndRerender();
}

init();
</script>
